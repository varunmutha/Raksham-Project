<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live IMU 3D Trajectory</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            color: #333;
        }

        #canvas-container {
            width: 100vw;
            height: 100vh;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }

        /* UI Styling */
        header {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 10;
        }

        h1 {
            margin: 0;
            font-size: 24px;
            font-weight: 700;
            color: #333;
        }

        .glass-panel {
            position: absolute;
            top: 70px;
            left: 20px;
            z-index: 10;
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 102, 0, 0.3); /* Orange accent border */
            border-left: 4px solid #ff6600;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.05);
            border-radius: 12px;
            padding: 20px;
            width: 250px;
        }

        .data-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 12px;
            font-variant-numeric: tabular-nums;
        }

        .data-row:last-child {
            margin-bottom: 0;
            margin-top: 16px;
            padding-top: 16px;
            border-top: 1px solid rgba(0, 0, 0, 0.1);
        }

        .label {
            font-size: 14px;
            color: #666;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .value {
            font-size: 16px;
            font-weight: 700;
            color: #111;
        }

        .accent {
            color: #ff6600;
        }

        .controls {
            position: absolute;
            bottom: 20px;
            right: 20px;
            z-index: 10;
        }

        button {
            background: rgba(255, 255, 255, 0.9);
            border: 1px solid rgba(255, 102, 0, 0.5);
            color: #ff6600;
            padding: 8px 16px;
            border-radius: 20px;
            font-weight: 600;
            cursor: pointer;
            backdrop-filter: blur(4px);
            transition: all 0.2s ease;
            box-shadow: 0 4px 12px rgba(255, 102, 0, 0.1);
        }

        button:hover {
            background: #ff6600;
            color: white;
            box-shadow: 0 4px 15px rgba(255, 102, 0, 0.3);
        }
    </style>
    <!-- Include Three.js from CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <!-- Include OrbitControls -->
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>

    <header>
        <h1>Live IMU 3D Trajectory</h1>
    </header>

    <div class="glass-panel">
        <div class="data-row">
            <span class="label">Accel X</span>
            <span class="value accent" id="val-ax">0.000</span>
        </div>
        <div class="data-row">
            <span class="label">Accel Y</span>
            <span class="value accent" id="val-ay">0.000</span>
        </div>
        <div class="data-row">
            <span class="label">Accel Z</span>
            <span class="value accent" id="val-az">0.000</span>
        </div>
        <div class="data-row">
            <span class="label">Distance</span>
            <span class="value" id="val-dist">0.00</span>
        </div>
    </div>

    <div class="controls">
        <button id="toggle-rotate">Auto Rotate: OFF</button>
    </div>

    <div id="canvas-container"></div>

    <script>
        // --- GLOBALS & CONFIG ---
        const CONFIG = {
            primaryColor: 0xff6600,
            bgColor: 0xffffff,
            scaleFactor: 0.1,    // Tuning movement scale
            maxPoints: 1000,     // Trail limit
            maxBounds: 50,       // Clamping limit
            lerpSpeed: 0.1       // Smooth interpolation speed
        };

        // DOM Elements
        const elAx = document.getElementById('val-ax');
        const elAy = document.getElementById('val-ay');
        const elAz = document.getElementById('val-az');
        const elDist = document.getElementById('val-dist');
        const btnRotate = document.getElementById('toggle-rotate');

        // State
        let scene, camera, renderer, controls;
        let marker, originGlow;
        let trailLine;
        
        let targetPosition = new THREE.Vector3(0, 0, 0);
        let currentPosition = new THREE.Vector3(0, 0, 0);
        
        // Circular buffer technique for trail
        const trailPositions = new Float32Array(CONFIG.maxPoints * 3);
        let trailHead = 0; // Current count of points (up to maxPoints)

        let isAutoRotate = false;
        let pulseTime = 0;

        // --- INITIALIZATION ---
        function initScene() {
            const container = document.getElementById('canvas-container');

            // 1. Scene
            scene = new THREE.Scene();
            scene.background = new THREE.Color(CONFIG.bgColor);
            scene.fog = new THREE.FogExp2(CONFIG.bgColor, 0.015);

            // 2. Camera
            camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(10, 10, 10);

            // 3. Renderer
            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            container.appendChild(renderer.domElement);

            // 4. Controls
            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;
            controls.target.set(0, 0, 0);
            controls.autoRotateSpeed = 2.0;

            // 5. Lighting
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
            scene.add(ambientLight);

            const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
            dirLight.position.set(20, 30, 20);
            dirLight.castShadow = true;
            dirLight.shadow.mapSize.width = 2048;
            dirLight.shadow.mapSize.height = 2048;
            dirLight.shadow.camera.near = 0.5;
            dirLight.shadow.camera.far = 100;
            dirLight.shadow.camera.left = -20;
            dirLight.shadow.camera.right = 20;
            dirLight.shadow.camera.top = 20;
            dirLight.shadow.camera.bottom = -20;
            scene.add(dirLight);

            const hemiLight = new THREE.HemisphereLight(0xffffff, 0xe0e0e0, 0.4);
            scene.add(hemiLight);

            // 6. Environment Helpers
            // Grid
            const gridHelper = new THREE.GridHelper(40, 40, 0xdddddd, 0xeeeeee);
            gridHelper.position.y = -0.5; // Slightly below origin
            gridHelper.receiveShadow = true;
            scene.add(gridHelper);

            // Add invisible plane to receive shadows from grid
            const planeGeometry = new THREE.PlaneGeometry(100, 100);
            const planeMaterial = new THREE.ShadowMaterial({ opacity: 0.1 });
            const plane = new THREE.Mesh(planeGeometry, planeMaterial);
            plane.rotation.x = -Math.PI / 2;
            plane.position.y = -0.51;
            plane.receiveShadow = true;
            scene.add(plane);

            // Axis (RGB)
            const axesHelper = new THREE.AxesHelper(5);
            // Thickening lines visually is hard in native three.js webgl renderer, 
            // standard AxesHelper is used. X=Red, Y=Green, Z=Blue
            scene.add(axesHelper);

            // 7. Base Objects (Origin & Marker)
            
            // Origin Sphere (White Glow)
            const originGeo = new THREE.SphereGeometry(0.3, 32, 32);
            const originMat = new THREE.MeshStandardMaterial({ 
                color: 0xffffff, 
                emissive: 0xaaaaaa,
                emissiveIntensity: 0.5,
                roughness: 0.2
            });
            const origin = new THREE.Mesh(originGeo, originMat);
            scene.add(origin);

            // Origin Halo (Subtle glow)
            const haloGeo = new THREE.SphereGeometry(0.5, 32, 32);
            const haloMat = new THREE.MeshBasicMaterial({
                color: 0xffffff,
                transparent: true,
                opacity: 0.3,
                blending: THREE.AdditiveBlending
            });
            originGlow = new THREE.Mesh(haloGeo, haloMat);
            scene.add(originGlow);

            // Moving Marker Sphere (Orange)
            const markerGeo = new THREE.SphereGeometry(0.4, 32, 32);
            const markerMat = new THREE.MeshStandardMaterial({
                color: CONFIG.primaryColor,
                emissive: CONFIG.primaryColor,
                emissiveIntensity: 0.4,
                roughness: 0.3,
                metalness: 0.1
            });
            marker = new THREE.Mesh(markerGeo, markerMat);
            marker.castShadow = true;
            scene.add(marker);

            // Marker Light
            const ptLight = new THREE.PointLight(CONFIG.primaryColor, 1.5, 10);
            marker.add(ptLight);

            // 8. Trail Line Setup
            const trailGeo = new THREE.BufferGeometry();
            trailGeo.setAttribute('position', new THREE.BufferAttribute(trailPositions, 3));
            trailGeo.setDrawRange(0, 0); // Initially draw nothing

            const trailMat = new THREE.LineBasicMaterial({ 
                color: CONFIG.primaryColor,
                linewidth: 2, // Note: WebGL limits linewidth on most platforms to 1px
                transparent: true,
                opacity: 0.7
            });
            trailLine = new THREE.Line(trailGeo, trailMat);
            scene.add(trailLine);

            // Add origin as first point
            addPointToTrail(0, 0, 0);

            // Listeners
            window.addEventListener('resize', onWindowResize);
            btnRotate.addEventListener('click', () => {
                isAutoRotate = !isAutoRotate;
                controls.autoRotate = isAutoRotate;
                btnRotate.innerText = `Auto Rotate: ${isAutoRotate ? 'ON' : 'OFF'}`;
                if (isAutoRotate) {
                    btnRotate.style.background = '#ff6600';
                    btnRotate.style.color = 'white';
                } else {
                    btnRotate.style.background = 'rgba(255, 255, 255, 0.9)';
                    btnRotate.style.color = '#ff6600';
                }
            });
        }

        // --- CORE LOGIC ---

        function addPointToTrail(x, y, z) {
            const positions = trailLine.geometry.attributes.position.array;
            
            if (trailHead < CONFIG.maxPoints) {
                // Buffer not full, append
                positions[trailHead * 3] = x;
                positions[trailHead * 3 + 1] = y;
                positions[trailHead * 3 + 2] = z;
                trailHead++;
                trailLine.geometry.setDrawRange(0, trailHead);
            } else {
                // Buffer full, shift left
                for (let i = 0; i < (CONFIG.maxPoints - 1) * 3; i++) {
                    positions[i] = positions[i + 3];
                }
                // Add new at end
                const lastIdx = (CONFIG.maxPoints - 1) * 3;
                positions[lastIdx] = x;
                positions[lastIdx + 1] = y;
                positions[lastIdx + 2] = z;
            }
            
            trailLine.geometry.attributes.position.needsUpdate = true;
        }

        // Exposed function to update IMU logic
        window.updateIMU = function(ax, ay, az) {
            // Update Target Position based on pseudo-displacement
            targetPosition.x += ax * CONFIG.scaleFactor;
            targetPosition.y += ay * CONFIG.scaleFactor;
            targetPosition.z += az * CONFIG.scaleFactor;

            // Clamp values
            targetPosition.x = THREE.MathUtils.clamp(targetPosition.x, -CONFIG.maxBounds, CONFIG.maxBounds);
            targetPosition.y = THREE.MathUtils.clamp(targetPosition.y, -CONFIG.maxBounds, CONFIG.maxBounds); // Allow going below plane if needed
            targetPosition.z = THREE.MathUtils.clamp(targetPosition.z, -CONFIG.maxBounds, CONFIG.maxBounds);

            // Update UI
            elAx.innerText = ax.toFixed(3);
            elAy.innerText = ay.toFixed(3);
            elAz.innerText = az.toFixed(3);
        }

        // --- RENDER LOOP ---
        function animate() {
            requestAnimationFrame(animate);

            // 1. Interpolate current position towards target (Smooth Lerp)
            currentPosition.lerp(targetPosition, CONFIG.lerpSpeed);
            
            // 2. Update Marker
            marker.position.copy(currentPosition);

            // 3. Update Trail (only periodically or continuously, here we add continuously but you might threshold distance)
            const pts = trailLine.geometry.attributes.position.array;
            const lastX = pts[(trailHead - 1) * 3];
            const lastY = pts[(trailHead - 1) * 3 + 1];
            const lastZ = pts[(trailHead - 1) * 3 + 2];
            
            const distToLast = Math.sqrt(
                Math.pow(currentPosition.x - lastX, 2) + 
                Math.pow(currentPosition.y - lastY, 2) + 
                Math.pow(currentPosition.z - lastZ, 2)
            );

            // Add point to trail only if moved enough to prevent buffer exhaustion with identical points
            if (distToLast > 0.05) {
                addPointToTrail(currentPosition.x, currentPosition.y, currentPosition.z);
                
                // Update distance UI
                const distFromOrigin = currentPosition.length();
                elDist.innerText = distFromOrigin.toFixed(2) + " m";
            } else if (trailHead > 0) {
                // Keep the last point firmly attached to the marker even if not officially "pushed" to history
                // This makes the line touch the sphere perfectly
                const lastIdx = (trailHead - 1) * 3;
                pts[lastIdx] = currentPosition.x;
                pts[lastIdx + 1] = currentPosition.y;
                pts[lastIdx + 2] = currentPosition.z;
                trailLine.geometry.attributes.position.needsUpdate = true;
            }

            // 4. Subtle Effects
            pulseTime += 0.05;
            // Pulse the origin halo
            originGlow.scale.setScalar(1 + Math.sin(pulseTime) * 0.1);
            // Pulse the marker emissive
            marker.material.emissiveIntensity = 0.4 + Math.sin(pulseTime * 2) * 0.2;

            // 5. Update Camera Controls
            controls.update();

            // 6. Render
            renderer.render(scene, camera);
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        // --- STARTUP & SIMULATION ---

        initScene();
        animate();

        // Simulate incoming WebSocket data
        setInterval(() => {
            // Generate random drifted vector (simulating raw IMU ax, ay, az input before integration)
            // Using a random walk approach for smoother pseudo-realistic paths
            const ax = (Math.random() - 0.5) * 0.5; 
            const ay = (Math.random() - 0.5) * 0.5;
            const az = (Math.random() - 0.5) * 0.5;

            updateIMU(ax, ay, az);
        }, 50); // 20Hz update

    </script>
</body>
</html>
